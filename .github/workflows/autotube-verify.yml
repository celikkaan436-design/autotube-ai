name: "AutoTube · Veröffentlichung prüfen & Analytics"

on:
  schedule:
    - cron: "23 17 * * *"  # 19:23 MESZ / 18:23 MEZ — immer nach 18:00 Berlin
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: autotube-state
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUTOTUBE_GIT_PERSIST: "1"
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Status prüfen und Analytics sammeln
        run: python -m autotube verify
      - name: Zustand speichern
        if: always()
        run: |
          git config user.name "AutoTube Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "autotube: Verifizierung & Analytics [skip ci]"
          for i in 1 2 3 4; do git pull --rebase --autostash && git push && exit 0; sleep $((i*5)); done
          exit 1

  dashboard:
    needs: verify
    if: always()
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
