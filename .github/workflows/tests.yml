name: "AutoTube · Tests"

on:
  push:
    branches: [main]
    paths: ["autotube/**", "tests/**", "requirements.txt", ".github/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Unit- und End-to-End-Tests (externe Dienste gemockt, FFmpeg echt)
        env:
          RUN_SLOW: "1"
        run: python -m unittest discover -s tests -t . -v
      - name: Offline-Render-Test (echtes FFmpeg-Rendering + QA, ohne externe Dienste)
        run: python -m autotube demo --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-render
          path: |
            out/demo.mp4
            out/demo_thumbnail.jpg
            out/demo_qa.json
          retention-days: 7
