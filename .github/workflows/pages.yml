name: "AutoTube · Dashboard (GitHub Pages)"

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["dashboard/**"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "pydantic>=2.6"
      - run: python -m autotube dashboard --out site
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: |
          echo "::notice::Dashboard nicht veröffentlicht. GitHub Pages aktivieren: Settings, Pages, Source = GitHub Actions"
